minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix, --ignore-noqa, .]
        always_run: true
        pass_filenames: false
      - id: ruff-format
        args: [.]
        always_run: true
        pass_filenames: false
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (zero warnings)
        entry: node scripts/run-eslint.mjs --fix
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
