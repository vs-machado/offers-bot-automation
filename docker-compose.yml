services:
  db:
    image: postgres:15
    container_name: offers_db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-offers_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-offers_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: offers_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-offers_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-change-me}
      - NEXTAUTH_BACKEND_SECRET=${NEXTAUTH_BACKEND_SECRET:-dev-nextauth-backend-secret}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: offers_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - API_BASE_URL=${API_BASE_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-nextauth-secret-change-me}
      - NEXTAUTH_BACKEND_SECRET=${NEXTAUTH_BACKEND_SECRET:-dev-nextauth-backend-secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - backend
    restart: unless-stopped

  bot:
    build: .
    container_name: offers_bot
    ports:
      - "${QR_AUTH_PORT:-8081}:${QR_AUTH_PORT:-8080}"  # QR auth server (first-time setup only)
    environment:
      # Pass telegram and other env vars from .env file
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - SOURCE_CHATS=${SOURCE_CHATS}
      - TARGET_CHAT=${TARGET_CHAT}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LITELLM_API_BASE=${LITELLM_API_BASE}
      - ML_AFFILIATE_TAG=${ML_AFFILIATE_TAG}
      - ML_COOKIE_HEADER=${ML_COOKIE_HEADER}
      - ML_CSRF_TOKEN=${ML_CSRF_TOKEN}
      - SHOPEE_APP_ID=${SHOPEE_APP_ID}
      - SHOPEE_APP_SECRET=${SHOPEE_APP_SECRET}
      - ALIEXPRESS_APP_KEY=${ALIEXPRESS_APP_KEY}
      - ALIEXPRESS_APP_SECRET=${ALIEXPRESS_APP_SECRET}
      - ALIEXPRESS_TRACKING_ID=${ALIEXPRESS_TRACKING_ID}
      - AMAZON_AFFILIATE_TAG=${AMAZON_AFFILIATE_TAG}
      - AMAZON_COOKIE_HEADER=${AMAZON_COOKIE_HEADER}
      - AMAZON_MARKETPLACE_ID=${AMAZON_MARKETPLACE_ID}
      - POLL_EXISTING_MESSAGES=${POLL_EXISTING_MESSAGES}
      - BROWSER_RESOLVER_ENABLED=${BROWSER_RESOLVER_ENABLED}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS}
      - BROWSER_TIMEOUT_MS=${BROWSER_TIMEOUT_MS}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:

