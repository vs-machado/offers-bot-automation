version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # We can pre-load or run the model pull automatically:
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2:3b && wait"]

  bot:
    build: .
    container_name: offers_bot
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # Pass telegram and other env vars from .env file
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - SOURCE_CHATS=${SOURCE_CHATS}
      - TARGET_CHAT=${TARGET_CHAT}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - ML_AFFILIATE_TAG=${ML_AFFILIATE_TAG}
      - ML_COOKIE_HEADER=${ML_COOKIE_HEADER}
      - ML_CSRF_TOKEN=${ML_CSRF_TOKEN}
      - SHOPEE_APP_ID=${SHOPEE_APP_ID}
      - SHOPEE_APP_SECRET=${SHOPEE_APP_SECRET}
      - ALIEXPRESS_APP_KEY=${ALIEXPRESS_APP_KEY}
      - ALIEXPRESS_APP_SECRET=${ALIEXPRESS_APP_SECRET}
      - ALIEXPRESS_TRACKING_ID=${ALIEXPRESS_TRACKING_ID}
      - AMAZON_AFFILIATE_TAG=${AMAZON_AFFILIATE_TAG}
      - AMAZON_COOKIE_HEADER=${AMAZON_COOKIE_HEADER}
      - AMAZON_MARKETPLACE_ID=${AMAZON_MARKETPLACE_ID}
      - POLL_EXISTING_MESSAGES=${POLL_EXISTING_MESSAGES}
      - BROWSER_RESOLVER_ENABLED=${BROWSER_RESOLVER_ENABLED}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS}
      - BROWSER_TIMEOUT_MS=${BROWSER_TIMEOUT_MS}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama_data:
